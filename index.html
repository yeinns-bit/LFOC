<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>¿Me amas?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#05060f;
    --night-2:#0a0d23;
    --night-3:#141a3a;
    --glow:#cfd8ff;
    --gold:#f6e7b4;
    --rose:#ffc8dd;
    --accent:#a9b8ff;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ min-height:100%; }

  body{
    font-family:"Cormorant Garamond", serif;
    background:
      radial-gradient(120% 90% at 50% -10%, #1a2150 0%, var(--night-3) 25%, var(--night-2) 55%, var(--night-1) 100%);
    background-attachment:fixed;
    color:var(--glow);
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
    position:relative;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .nebula{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(40% 30% at 18% 28%, rgba(120,90,200,.28), transparent 70%),
      radial-gradient(35% 28% at 82% 22%, rgba(60,120,220,.22), transparent 70%),
      radial-gradient(45% 35% at 70% 80%, rgba(220,100,160,.18), transparent 70%),
      radial-gradient(30% 25% at 25% 78%, rgba(90,160,220,.16), transparent 70%);
    filter:blur(6px);
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ transform:translate3d(-1.5%, -1%, 0) scale(1.02); opacity:.85; }
    to{   transform:translate3d(1.5%, 1.5%, 0) scale(1.08); opacity:1; }
  }

  #sky{ position:fixed; inset:0; z-index:1; }

  .stage{
    position:relative; z-index:3;
    min-height:100vh;
    min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(18px, 5vw, 40px);
    padding-top:max(clamp(18px,5vw,40px), env(safe-area-inset-top));
    padding-bottom:max(clamp(18px,5vw,40px), env(safe-area-inset-bottom));
    text-align:center;
  }
  .scene{ width:min(880px, 100%); }
  .hidden{ display:none !important; }

  /* ---------- question ---------- */
  .ask-eyebrow{
    font-size:clamp(.85rem,2.4vw,1.3rem);
    letter-spacing:.36em; text-transform:uppercase;
    color:var(--accent); opacity:0;
    animation:rise .9s ease forwards .15s;
  }
  .ask-title{
    font-family:"Tangerine", cursive; font-weight:700;
    font-size:clamp(4rem, 18vw, 11rem); line-height:.9;
    color:var(--gold); margin:.08em 0 .2em;
    text-shadow:0 0 22px rgba(246,231,180,.45), 0 0 60px rgba(246,231,180,.18);
    opacity:0; animation:rise 1s ease forwards .35s;
  }
  .ask-sub{
    font-size:clamp(1rem,2.6vw,1.5rem); font-style:italic;
    letter-spacing:.04em; color:var(--glow); opacity:0;
    animation:rise 1s ease forwards .6s;
  }
  .buttons{
    margin-top:clamp(2rem,6vw,3.6rem);
    display:flex; gap:clamp(16px,4vw,26px); justify-content:center; align-items:center;
    flex-wrap:wrap; opacity:0; animation:rise 1s ease forwards .85s;
  }
  .btn{
    font-family:"Cormorant Garamond", serif;
    font-size:clamp(1.1rem,3vw,1.6rem);
    letter-spacing:.16em; text-transform:uppercase;
    padding:.7em 2.2em; border-radius:999px; cursor:pointer;
    background:transparent;
    -webkit-tap-highlight-color:transparent;
    transition:transform .35s cubic-bezier(.2,.9,.2,1), box-shadow .35s, background .35s, color .35s;
    position:relative; will-change:transform;
  }
  .btn-yes{
    color:var(--night-1); border:1px solid rgba(246,231,180,.9);
    background:linear-gradient(135deg, #fff3cf, var(--gold));
    box-shadow:0 0 28px rgba(246,231,180,.45), inset 0 0 18px rgba(255,255,255,.4);
  }
  .btn-yes:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 0 44px rgba(246,231,180,.75), inset 0 0 22px rgba(255,255,255,.55);
  }
  .btn-no{
    color:var(--glow); border:1px solid rgba(169,184,255,.5);
    background:rgba(255,255,255,.03); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  .btn-no:hover{ box-shadow:0 0 22px rgba(169,184,255,.25); }

  /* ---------- "No" cartoon reaction ---------- */
  #noReaction{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(12px,3vw,20px); padding:24px;
    background:rgba(5,6,15,.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  #noReaction.show{ opacity:1; }
  .toon-wrap{ animation:popToon .5s cubic-bezier(.2,1.4,.4,1) both; }
  .toon-wrap svg{ width:clamp(150px, 45vw, 220px); height:auto; }
  .toon-bubble{
    font-family:"Cormorant Garamond", serif; font-style:italic;
    font-size:clamp(1.3rem,5vw,2.4rem); color:var(--rose);
    text-shadow:0 0 18px rgba(255,200,221,.5); text-align:center;
    animation:rise .5s ease both .15s;
  }
  @keyframes popToon{ from{ transform:scale(.3) rotate(-12deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }

  /* ---------- love message ---------- */
  #message{ opacity:0; padding:clamp(28px,7vw,52px) 0 clamp(70px,12vw,100px); }
  #message.show{ animation:fadeScene 1.4s ease forwards; }
  .const-heading{
    font-family:"Tangerine", cursive; font-weight:700;
    font-size:clamp(3rem,12vw,7rem); line-height:1; color:var(--rose);
    text-shadow:0 0 26px rgba(255,200,221,.5), 0 0 70px rgba(255,200,221,.2);
    margin-bottom:.3em;
  }
  .love-lines{
    font-size:clamp(1.2rem, 4vw, 2.2rem); font-weight:500; line-height:1.7;
    color:#f4f6ff; max-width:740px; margin:0 auto; padding:0 8px;
    text-shadow:0 0 18px rgba(180,200,255,.35);
  }
  .love-lines .ln{ display:block; opacity:0; transform:translateY(18px); }
  .love-lines .em{ color:var(--gold); font-style:italic; }
  .love-lines .final{
    display:block; margin-top:.5em; font-family:"Tangerine", cursive;
    font-size:clamp(2.4rem,9vw,4.2rem); color:var(--rose);
    text-shadow:0 0 24px rgba(255,200,221,.55);
  }
  .const-dot{
    display:inline-block; width:7px; height:7px; margin:0 .15em; border-radius:50%;
    background:radial-gradient(circle at 40% 40%, #fff, var(--accent) 70%);
    box-shadow:0 0 10px rgba(207,216,255,.9); vertical-align:middle; transform:scale(0);
  }

  /* ---------- polaroid gallery ---------- */
  .gallery{
    margin:clamp(2.2rem,6vw,3.4rem) auto 0; max-width:840px;
    display:flex; flex-wrap:wrap; gap:clamp(16px,4vw,26px); justify-content:center;
  }
  .polaroid{
    width:clamp(140px, 40vw, 210px);
    background:linear-gradient(160deg, #fdfbf4, #efeadc);
    padding:10px 10px 0; border-radius:6px;
    box-shadow:0 14px 40px rgba(0,0,0,.55), 0 0 24px rgba(207,216,255,.18);
    transform:rotate(var(--rot)); opacity:0;
    animation:polaroidIn .8s ease forwards calc(.3s + var(--i) * .25s);
    transition:transform .4s ease, box-shadow .4s ease; cursor:pointer;
    will-change:transform;
  }
  .polaroid .float{
    animation:floaty 6s ease-in-out infinite calc(1s + var(--i) * .4s);
  }
  .polaroid:hover{
    transform:rotate(0deg) scale(1.06) !important;
    box-shadow:0 22px 60px rgba(0,0,0,.6), 0 0 40px rgba(255,200,221,.4);
    z-index:5;
  }
  .polaroid img{
    width:100%; display:block; border-radius:3px;
    filter:saturate(1.05) contrast(1.03);
  }
  .polaroid figcaption{
    font-family:"Tangerine", cursive; font-size:clamp(1.3rem,4.5vw,1.7rem); color:#3a2e4a;
    text-align:center; padding:6px 0 10px; line-height:1;
  }

  .heart{ margin-top:clamp(1.8em,5vw,2.4em); font-size:clamp(1.4rem,5vw,1.8rem); color:var(--rose); opacity:0; animation-fill-mode:forwards; }
  .replay{
    margin-top:clamp(1.6rem,5vw,2rem); font-size:clamp(.85rem,2.6vw,1rem); letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); background:none; border:none; cursor:pointer; opacity:0;
    transition:color .3s; padding:.6em 1em; -webkit-tap-highlight-color:transparent;
  }
  .replay:hover{ color:var(--gold); }

  /* ---------- copyright ---------- */
  .copyright{
    position:fixed; left:0; right:0; z-index:6; text-align:center;
    bottom:max(12px, env(safe-area-inset-bottom));
    font-size:clamp(.7rem,2vw,.85rem); letter-spacing:.28em; text-transform:uppercase;
    color:rgba(207,216,255,.55); pointer-events:none;
  }
  .copyright span{ color:var(--gold); }

  @keyframes rise{ from{ opacity:0; transform:translateY(26px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes fadeScene{ from{opacity:0;} to{opacity:1;} }
  @keyframes lnIn{ to{ opacity:1; transform:translateY(0);} }
  @keyframes dotPop{ to{ transform:scale(1);} }
  @keyframes beat{ 0%,100%{ transform:scale(1); opacity:.9;} 50%{ transform:scale(1.25); opacity:1;} }
  @keyframes polaroidIn{ to{ opacity:1; transform:rotate(var(--rot));} }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-12px);} }

  /* tighter spacing on short landscape phones */
  @media (max-height:480px) and (orientation:landscape){
    .ask-title{ font-size:clamp(3rem,12vh,6rem); }
    .buttons{ margin-top:1.2rem; }
  }

  /* accessibility: respect reduced motion */
  @media (prefers-reduced-motion: reduce){
    .nebula, .polaroid .float, .heart{ animation:none !important; }
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; }
    .love-lines .ln, .polaroid{ opacity:1 !important; transform:none !important; }
    .const-dot{ transform:scale(1) !important; }
  }
</style>
</head>
<body>
  <div class="nebula"></div>
  <canvas id="sky"></canvas>

  <div class="stage">
    <!-- QUESTION -->
    <section class="scene" id="question">
      <p class="ask-eyebrow">una pregunta entre las estrellas</p>
      <h1 class="ask-title">¿Me amas?</h1>
      <p class="ask-sub">Solo tienes que elegir...</p>
      <div class="buttons">
        <button class="btn btn-yes" id="yes">Sí</button>
        <button class="btn btn-no" id="no">No</button>
      </div>
    </section>

    <!-- LOVE MESSAGE -->
    <section class="scene hidden" id="message">
      <h2 class="const-heading">Lo sabía ✦</h2>
      <p class="love-lines">
        <span class="ln">Eres mi más bonita <span class="em">coincidencia</span><span class="const-dot"></span></span>
        <span class="ln">te amo esta vida y todas las que vengan,</span>
        <span class="ln">a tu lado siento que no me falta nada<span class="const-dot"></span></span>
        <span class="ln">más para ser feliz.</span>

  <!-- "No" cartoon reaction -->
  <div id="noReaction">
    <div class="toon-wrap" id="toonWrap"></div>
    <div class="toon-bubble">¿Cómo que no?! 😤</div>
  </div>

  <div class="copyright">© <span>Yeinns F</span></div>

<script>
/* ===== Cute cartoon flipping the bird (SVG) ===== */
const TOON = `
<svg viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="110" cy="150" rx="74" ry="78" fill="#ffd9c2" stroke="#caa089" stroke-width="3"/>
  <path d="M70 120 L98 132" stroke="#5a3b2e" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 120 L122 132" stroke="#5a3b2e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="85" cy="146" r="9" fill="#3a2a22"/>
  <circle cx="135" cy="146" r="9" fill="#3a2a22"/>
  <path d="M92 182 Q110 170 128 182" stroke="#b5483f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="70" cy="168" rx="11" ry="7" fill="#ff9a9a" opacity=".6"/>
  <ellipse cx="150" cy="168" rx="11" ry="7" fill="#ff9a9a" opacity=".6"/>
  <g transform="rotate(-8 165 90)">
    <rect x="150" y="78" width="30" height="60" rx="15" fill="#ffd9c2" stroke="#caa089" stroke-width="3"/>
    <circle cx="165" cy="74" r="22" fill="#ffd9c2" stroke="#caa089" stroke-width="3"/>
    <rect x="157" y="22" width="16" height="40" rx="8" fill="#ffe2cf" stroke="#caa089" stroke-width="3"/>
    <path d="M152 78 h26 M152 86 h26" stroke="#caa089" stroke-width="2" opacity=".6"/>
  </g>
  <path d="M40 96 l8 8 M52 92 l-2 11 M62 88 l9 6" stroke="#ff7676" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>`;
document.getElementById('toonWrap').innerHTML = TOON;

/* ===== Starfield (crisp on retina) + constellations + shooting stars ===== */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, stars = [], shooters = [];

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildStars();
}
function buildStars(){
  // fewer stars on small screens for smooth performance
  const area = W * H;
  const divisor = W < 640 ? 9000 : 6500;
  const count = Math.min(W < 640 ? 150 : 260, Math.floor(area / divisor));
  stars = [];
  for(let i=0;i<count;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.4+0.3, base:Math.random()*0.5+0.4,
      tw:Math.random()*0.04+0.005, phase:Math.random()*Math.PI*2,
      hue: Math.random()<0.15 ? '255,220,180' : (Math.random()<0.2 ? '200,210,255':'255,255,255')
    });
  }
}
function spawnShooter(){
  const fromLeft = Math.random()<0.5;
  shooters.push({
    x: fromLeft ? -50 : W+50, y: Math.random()*H*0.5,
    vx:(fromLeft?1:-1)*(6+Math.random()*4), vy: 2+Math.random()*2.5, life:1
  });
}
const linkDist = () => (W < 640 ? 90 : 120);
function draw(){
  ctx.clearRect(0,0,W,H);
  const LD = linkDist();
  ctx.lineWidth = 0.5;
  for(let i=0;i<stars.length;i++){
    for(let j=i+1;j<i+4 && j<stars.length;j++){
      const a=stars[i], b=stars[j];
      const dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<LD){
        ctx.strokeStyle=`rgba(169,184,255,${(1-d/LD)*0.12})`;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }
  }
  for(const s of stars){
    s.phase += s.tw;
    const tw = s.base + Math.sin(s.phase)*0.4;
    ctx.beginPath();
    ctx.fillStyle=`rgba(${s.hue},${Math.max(0,tw)})`;
    ctx.shadowBlur = s.r*4; ctx.shadowColor = `rgba(${s.hue},0.8)`;
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
  for(let i=shooters.length-1;i>=0;i--){
    const sh=shooters[i];
    sh.x+=sh.vx; sh.y+=sh.vy; sh.life-=0.012;
    const grad=ctx.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*8,sh.y-sh.vy*8);
    grad.addColorStop(0,`rgba(255,255,255,${sh.life})`);
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=grad; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(sh.x-sh.vx*8, sh.y-sh.vy*8); ctx.stroke();
    if(sh.life<=0 || sh.x<-100 || sh.x>W+100) shooters.splice(i,1);
  }
  requestAnimationFrame(draw);
}
let resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ resize(); baseRect = null; }, 150);
});
resize(); draw();
if(!reduceMotion){ setInterval(()=>{ if(Math.random()<0.6) spawnShooter(); }, 2600); }

/* ===== Interactions ===== */
const question = document.getElementById('question');
const message  = document.getElementById('message');
const yesBtn   = document.getElementById('yes');
const noBtn    = document.getElementById('no');
const replay   = document.getElementById('replay');
const noReaction = document.getElementById('noReaction');
const canHover = window.matchMedia('(hover: hover)').matches;

let noNudges = 0;
let baseRect = null;
function dodge(){
  noNudges++;
  if(!baseRect) baseRect = noBtn.getBoundingClientRect();
  const margin = 16;
  const bw = baseRect.width, bh = baseRect.height;
  const maxX = Math.max(margin, window.innerWidth  - bw - margin);
  const maxY = Math.max(margin, window.innerHeight - bh - margin);
  const targetX = margin + Math.random()*(maxX - margin);
  const targetY = margin + Math.random()*(maxY - margin);
  const dx = targetX - baseRect.left;
  const dy = targetY - baseRect.top;
  const scale = Math.max(0.55, 1 - noNudges*0.08);
  noBtn.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
  noBtn.style.opacity = Math.max(0.45, 1 - noNudges*0.08);
  if(noNudges>=5) noBtn.textContent='¿Segura? 🙈';
}
// only flee on hover for devices that actually have a pointer
if(canHover){ noBtn.addEventListener('mouseenter', dodge); }

let toonTimer;
function showToon(){
  noReaction.classList.add('show');
  noReaction.style.pointerEvents='auto';
  clearTimeout(toonTimer);
  toonTimer = setTimeout(()=>{
    noReaction.classList.remove('show');
    noReaction.style.pointerEvents='none';
  }, 2200);
}
noBtn.addEventListener('click', (e)=>{ e.preventDefault(); showToon(); dodge(); });
noBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); showToon(); dodge(); }, {passive:false});
noReaction.addEventListener('click', ()=>{
  clearTimeout(toonTimer);
  noReaction.classList.remove('show'); noReaction.style.pointerEvents='none';
});

function revealMessage(){
  question.classList.add('hidden');
  message.classList.remove('hidden');
  message.classList.add('show');
  if(!reduceMotion){ for(let k=0;k<6;k++) setTimeout(spawnShooter, k*180); }
  const lines = message.querySelectorAll('.love-lines .ln');
  lines.forEach((ln,i)=>{ ln.style.animation = `lnIn .9s ease forwards ${0.5 + i*0.55}s`; });
  message.querySelectorAll('.const-dot').forEach((d,i)=>{ d.style.animation = `dotPop .6s ease forwards ${1.4 + i*0.7}s`; });
  const heart = message.querySelector('.heart');
  const total = 0.5 + lines.length*0.55 + 0.4;
  heart.style.animation = `rise .8s ease forwards ${total}s, beat 1.8s ease-in-out ${total+0.8}s infinite`;
  replay.style.transition='opacity 1s ease';
  setTimeout(()=>{ replay.style.opacity='1'; }, (total+1)*1000);
}
yesBtn.addEventListener('click', revealMessage);

replay.addEventListener('click', ()=>{
  message.classList.add('hidden'); message.classList.remove('show');
  question.classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
  noNudges=0; baseRect=null;
  noBtn.style.transform=''; noBtn.style.opacity='';
  noBtn.textContent='No';
});
</script>
